name: Independence gate
on: [push, pull_request]
jobs:
  independence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Supply-chain validation runs in CI and release validation. Keep this
      # distinct native-only packaging constraint under its existing check name.
      - name: Verify native-only packaging inputs
        run: |
          set -euo pipefail
          tracked_files="$(mktemp)"
          trap 'rm -f "$tracked_files"' EXIT
          git ls-files -z > "$tracked_files"
          docker_path_found=false
          while IFS= read -r -d '' tracked_path; do
            tracked_name="${tracked_path##*/}"
            tracked_name="${tracked_name,,}"
            case "$tracked_name" in
              dockerfile* | docker-compose*.yml | docker-compose*.yaml)
                printf '%s\n' "$tracked_path"
                docker_path_found=true
                ;;
            esac
          done < "$tracked_files"
          if [[ "$docker_path_found" == true ]]; then
            exit 1
          fi
