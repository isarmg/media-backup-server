[workspace]
members = [
    "crates/protocol",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.3.17"
edition = "2021"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
bytes = "1"
http = "1"
jni = "0.21"
rand = "0.8"
rustix = { version = "1.1", features = ["fs", "system"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "json", "derive"] }
subtle = "2"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sarmg-secret = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "946bbb5f4bf3e06d421b6f463bd637b83617a5be", version = "=0.8.8" }
sarmg-secret-envelope = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "946bbb5f4bf3e06d421b6f463bd637b83617a5be", version = "=0.8.8" }
